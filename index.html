<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nectar | Boutique Florist</title>
    <style>
        /* --- 1. FONTS & ROOT RESETS --- */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: "Plus Jakarta Sans", sans-serif;
            overflow-x: hidden;
            background-color: #2b506f; /* Base aesthetic matching the photo */
        }

        /* --- 2. HERO BACKGROUND WRAPPER --- */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* High-resolution moody floral setup mapped to match the aesthetic */
            background: linear-gradient(rgba(43, 80, 111, 0.35), rgba(43, 80, 111, 0.2)), 
                        url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            padding: 30px 5%;
        }

        /* --- 3. TRANSPARENT NAVIGATION BAR --- */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        /* Hummingbird & Rose Vector Logo Wrapper */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.85;
            transition: opacity 0.2s;
        }

        nav a:hover {
            opacity: 1;
        }

        .contact-btn {
            background-color: #ffffff;
            color: #2b506f;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s;
        }

        .contact-btn:hover {
            transform: scale(1.03);
            background-color: #f0f0f0;
        }

        /* --- 4. CENTERED HERO TYPOGRAPHY --- */
        .hero-content {
            text-align: center;
            z-index: 5;
            margin-bottom: 4vh;
        }

        .hero-title {
            font-family: "Playfair Display", serif;
            font-size: 82px;
            font-weight: 400;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            opacity: 0.9;
        }

        /* Animated Down Chevron Indicator */
        .scroll-indicator {
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 10px;
        }

        .scroll-indicator svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        /* --- 5. VERTICAL SLIDER DOTS NAVIGATION --- */
        .side-pagination {
            position: absolute;
            right: 3%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            background-color: transparent;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .dot.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        /* Animation definition for scroll bounce */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-8px); }
            60% { transform: translateY(-4px); }
        }

        /* Responsiveness adjustments for smaller devices */
        @media (max-width: 768px) {
            nav { display: none; }
            .hero-title { font-size: 54px; }
            .hero-subtitle { font-size: 14px; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Transparent Header Block -->
        <header>
            <div class="logo-container">
                <!-- Inline SVG representing the stylized bird/flower graphic icon -->
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"/>
                    <path d="M12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16C14.2091 16 16 14.2091 16 12"/>
                    <path d="M12 2V12L19 15" stroke-linecap="round"/>
                </svg>
            </div>
            
            <nav>
                <a href="#order">Order Flowers</a>
                <a href="#weddings">Weddings & Events</a>
                <a href="#giftcards">Gift Cards</a>
                <a href="#about">About</a>
            </nav>

            <a href="#contact" class="contact-btn">Contact</a>
        </header>

        <!-- Centered Branding Block -->
        <div class="hero-content">
            <h1 class="hero-title">Nectar</h1>
            <p class="hero-subtitle">boutique florist &nbsp;|&nbsp; weddings & events</p>
        </div>

        <!-- Animated Bottom Navigation Chevron -->
        <div class="scroll-indicator" onclick="scrollToNextSection()">
            <svg viewBox="0 0 24 24">
                <path d="M6 9L12 15L18 9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Floating Vertical Navigation Rail -->
        <div class="side-pagination">
            <div class="dot active" onclick="selectDot(0)"></div>
            <div class="dot" onclick="selectDot(1)"></div>
            <div class="dot" onclick="selectDot(2)"></div>
            <div class="dot" onclick="selectDot(3)"></div>
        </div>
    </section>

    <!-- --- 6. JAVASCRIPT PANEL LOGIC --- -->
    <script>
        function selectDot(index) {
            // Fetch array matching dot class parameters
            const dots = document.querySelectorAll('.dot');
            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');
            
            // Console logger confirmation placeholder
            console.log("Navigated to slide segment index: " + index);
        }

        function scrollToNextSection() {
            alert("Scrolling function triggered to check secondary content panes below!");
        }
    </script>
</body>
</html>
