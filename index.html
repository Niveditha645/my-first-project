<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nectar | Boutique Florist</title>
    <style>
        /* --- 1. FONTS & ROOT RESETS --- */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: "Plus Jakarta Sans", sans-serif;
            overflow-x: hidden;
            background-color: #1a364d; /* Dark elegant blue base */
        }

        /* --- 2. HERO AREA WITH SIDE FLORALS --- */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            padding: 30px 5%;
            z-index: 1;
        }

        /* Left side accent floral arrangement */
        .hero-section::before {
            content: "";
            position: absolute;
            top: 10%;
            left: -50px;
            width: 350px;
            height: 500px;
            background: url('https://unsplash.com') no-repeat left center;
            background-size: contain;
            opacity: 0.85;
            z-index: -1;
            pointer-events: none;
        }

        /* Right side main bouquet arrangement */
        .hero-section::after {
            content: "";
            position: absolute;
            bottom: 5%;
            right: -20px;
            width: 450px;
            height: 650px;
            background: url('https://unsplash.com') no-repeat right center;
            background-size: contain;
            opacity: 0.9;
            z-index: -1;
            pointer-events: none;
        }

        /* --- 3. TRANSPARENT NAVIGATION BAR --- */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.25;
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 1px;
            opacity: 0.8;
            transition: opacity 0.2s, border-bottom 0.2s;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 1;
        }

        .contact-btn {
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #ffffff;
            color: #1a364d;
        }

        /* --- 4. CENTERED HERO TYPOGRAPHY --- */
        .hero-content {
            text-align: center;
            z-index: 5;
            margin-bottom: 5vh;
        }

        .hero-title {
            font-family: "Playfair Display", serif;
            font-size: 96px;
            font-weight: 300;
            letter-spacing: 12px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 6px;
            opacity: 0.8;
            text-transform: lowercase;
        }

        /* Bottom chevron */
        .scroll-indicator {
            cursor: pointer;
            animation: bounce 2s infinite;
            margin-bottom: 10px;
            opacity: 0.7;
        }

        .scroll-indicator svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        /* --- 5. VERTICAL SLIDER DOTS --- */
        .side-pagination {
            position: absolute;
            right: 4%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: #ffffff;
            transform: scale(1.5);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
            60% { transform: translateY(-3px); }
        }

        /* Responsiveness for mobile screening panels */
        @media (max-width: 900px) {
            nav { display: none; }
            .hero-title { font-size: 64px; letter-spacing: 6px; }
            .hero-section::before { width: 200px; height: 350px; }
            .hero-section::after { width: 250px; height: 450px; }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <!-- Transparent Header Menu -->
        <header>
            <div class="logo-container">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                    <path d="M2 12h20" />
                </svg>
            </div>
            
            <nav>
                <a href="#order">Order Flowers</a>
                <a href="#weddings">Weddings & Events</a>
                <a href="#giftcards">Gift Cards</a>
                <a href="#about">About</a>
            </nav>

            <a href="#contact" class="contact-btn">Contact</a>
        </header>

        <!-- Centered Main Title Content -->
        <div class="hero-content">
            <h1 class="hero-title">Nectar</h1>
            <p class="hero-subtitle">boutique florist &nbsp;|&nbsp; weddings & events</p>
        </div>

        <!-- Scroll Indicator Arrow -->
        <div class="scroll-indicator">
            <svg viewBox="0 0 24 24">
                <path d="M6 9L12 15L18 9" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Right Hand Pagination Rail -->
        <div class="side-pagination">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </section>

</body>
</html>
